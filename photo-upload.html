<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 Fotos hochladen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --gold: #f0c060;
    --dark: #1a1208;
    --mid: #2e2010;
    --cream: #fdf6e3;
    --accent: #e8854a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, #3d2a00 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, #2a1500 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #1a0f00 0%, transparent 70%);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .party-badge {
    display: inline-block;
    background: rgba(240,192,96,0.12);
    border: 1px solid rgba(240,192,96,0.3);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 9vw, 52px);
    font-weight: 900;
    line-height: 1.05;
    background: linear-gradient(135deg, #fff 0%, var(--gold) 60%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 15px;
    font-weight: 300;
    line-height: 1.5;
  }

  .drop-zone {
    border: 2px dashed rgba(240,192,96,0.3);
    border-radius: 20px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: rgba(240,192,96,0.03);
    position: relative;
    margin-bottom: 20px;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--gold);
    background: rgba(240,192,96,0.07);
    transform: scale(1.01);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon { font-size: 48px; margin-bottom: 16px; display: block; }
  .drop-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--cream); margin-bottom: 8px; }
  .drop-sub { font-size: 13px; color: rgba(255,255,255,0.35); }

  .preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .preview-item {
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: rgba(255,255,255,0.05);
  }

  .preview-item img { width: 100%; height: 100%; object-fit: cover; }

  .preview-item .remove {
    position: absolute;
    top: 4px; right: 4px;
    background: rgba(0,0,0,0.6);
    border: none;
    border-radius: 50%;
    width: 22px; height: 22px;
    color: white; font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .preview-item .upload-status {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .name-field { margin-bottom: 20px; }

  .name-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 8px;
  }

  .name-field input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--cream);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .name-field input:focus { border-color: var(--gold); }
  .name-field input::placeholder { color: rgba(255,255,255,0.2); }

  .upload-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    color: var(--dark);
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.02em;
  }

  .upload-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(240,192,96,0.3);
  }

  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 100px;
    margin-top: 16px;
    overflow: hidden;
    display: none;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    border-radius: 100px;
    transition: width 0.3s;
    width: 0%;
  }

  .status-text {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-top: 12px;
    min-height: 20px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--mid);
    border: 1px solid rgba(240,192,96,0.3);
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 14px;
    color: var(--cream);
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(100,220,100,0.4); }
  .toast.error { border-color: rgba(220,80,80,0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="party-badge">🎉 Party-Fotos</div>
    <h1>Teile<br>deine Bilder</h1>
    <p class="subtitle">Lade deine schönsten Momente<br>direkt aus deinem Kamera-Roll hoch.</p>
  </div>

  <div class="name-field">
    <label>Dein Name (optional)</label>
    <input type="text" id="uploaderName" placeholder="z.B. Lisa &amp; Marco" maxlength="40" />
  </div>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*,video/*" multiple />
    <span class="drop-icon">📷</span>
    <div class="drop-title">Fotos auswählen</div>
    <div class="drop-sub">Tippe hier oder ziehe Bilder rein</div>
  </div>

  <div class="preview-grid" id="previewGrid"></div>

  <button class="upload-btn" id="uploadBtn" onclick="startUpload()" disabled>
    ✨ Jetzt hochladen
  </button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status-text" id="statusText"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza2NulmLVVlFJbGRCNgXoNHI2nDLcz_Da_mY9CAhP7EzxwY14G6tNOEuq-URTilko/exec";

  let selectedFiles = [];

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');

  fileInput.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/')));
  });

  function handleFiles(files) {
    files.forEach(file => {
      if (!selectedFiles.find(f => f.name === file.name && f.size === file.size)) {
        selectedFiles.push(file);
        addPreview(file);
      }
    });
    updateUploadBtn();
  }

  function addPreview(file) {
    const grid = document.getElementById('previewGrid');
    const item = document.createElement('div');
    item.className = 'preview-item';
    item.dataset.name = file.name;

    if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      item.appendChild(img);
    } else {
      item.style.background = 'rgba(240,192,96,0.1)';
      item.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:28px">🎬</div>`;
    }

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove';
    removeBtn.textContent = '×';
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      selectedFiles = selectedFiles.filter(f => !(f.name === file.name && f.size === file.size));
      item.remove();
      updateUploadBtn();
    };
    item.appendChild(removeBtn);
    grid.appendChild(item);
  }

  function updateUploadBtn() {
    const btn = document.getElementById('uploadBtn');
    btn.disabled = selectedFiles.length === 0;
    if (selectedFiles.length > 0) {
      btn.textContent = `✨ ${selectedFiles.length} Datei${selectedFiles.length > 1 ? 'en' : ''} hochladen`;
    } else {
      btn.textContent = '✨ Jetzt hochladen';
    }
  }

  async function startUpload() {
    if (!selectedFiles.length) return;

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    progressBar.style.display = 'block';

    const name = document.getElementById('uploaderName').value.trim() || 'Gast';
    const timestamp = new Date().toISOString().slice(0,19).replace('T','_').replace(/:/g,'-');

    let uploaded = 0;
    let failed = 0;

    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];
      const previewItem = document.querySelector(`.preview-item[data-name="${CSS.escape(file.name)}"]`);

      statusText.textContent = `Lade hoch: ${i+1} von ${selectedFiles.length}…`;
      progressFill.style.width = ((i / selectedFiles.length) * 100) + '%';

      if (previewItem) {
        const spinner = document.createElement('div');
        spinner.className = 'upload-status';
        spinner.textContent = '⏳';
        previewItem.appendChild(spinner);
      }

      try {
        const ext = file.name.split('.').pop();
        const newName = `${name}_${timestamp}_${i+1}.${ext}`;
        await uploadFile(file, newName);
        uploaded++;
        if (previewItem) {
          const s = previewItem.querySelector('.upload-status');
          if (s) s.textContent = '✅';
        }
      } catch (err) {
        failed++;
        console.error(err);
        if (previewItem) {
          const s = previewItem.querySelector('.upload-status');
          if (s) s.textContent = '❌';
        }
      }
    }

    progressFill.style.width = '100%';

    if (failed === 0) {
      showToast(`🎉 ${uploaded} Foto${uploaded > 1 ? 's' : ''} erfolgreich hochgeladen!`, 'success');
      statusText.textContent = `✨ Danke! Alle Fotos wurden gespeichert.`;
      selectedFiles = [];
      setTimeout(() => {
        document.getElementById('previewGrid').innerHTML = '';
        progressBar.style.display = 'none';
        progressFill.style.width = '0%';
        updateUploadBtn();
      }, 3000);
    } else {
      showToast(`${uploaded} hochgeladen, ${failed} fehlgeschlagen.`, 'error');
      statusText.textContent = `⚠️ ${failed} Datei(en) konnten nicht hochgeladen werden.`;
      btn.disabled = false;
    }
  }

  async function uploadFile(file, filename) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        const params = new URLSearchParams({
          filename: filename,
          mimeType: file.type || 'application/octet-stream',
          data: base64
        });

        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
          });
          const json = await res.json();
          if (json.status === 'ok') resolve(json);
          else reject(new Error(json.error || 'Fehler'));
        } catch(e) { reject(e); }
      };
      reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden'));
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(() => toast.className = 'toast', 3500);
  }
</script>
</body>
</html>
